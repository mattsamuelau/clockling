; Clockling for the Freenove ESP32 Display (CYD).
; Build + flash:  pio run -e fnk0114b -t upload      (from targets/esp32)
; Serial log:     pio device monitor -e fnk0114b

[env]
platform = espressif32@6.9.0          ; Arduino-ESP32 2.0.17
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv   ; 1.9 MB app x2 (room for OTA later)
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.0
build_unflags = -std=gnu++11
build_flags =
    -O2
    -std=gnu++17
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DCORE_DEBUG_LEVEL=1
    ; TFT_eSPI is configured here instead of editing its User_Setup files.
    -DUSER_SETUP_LOADED=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=80000000
    -DSPI_READ_FREQUENCY=20000000
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320

; FNK0114B: 2.8" 240x320 ST7789 TN, XPT2046 touch on its own bit-banged pins.
[env:fnk0114b]
upload_port = COM7
monitor_port = COM7
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF=1
    -DTOUCH_CS_PIN=33
    -DTOUCH_CLK_PIN=25
    -DTOUCH_DIN_PIN=32
    -DTOUCH_DOUT_PIN=39
