; Clockling for the Freenove ESP32 Display (CYD).
; Build + flash:  pio run -e fnk0114b -t upload      (from targets/esp32)
; Serial log:     pio device monitor -e fnk0114b

[env]
platform = espressif32@6.9.0          ; Arduino-ESP32 2.0.17
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv   ; 1.9 MB app x2 (room for OTA later)
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.0
build_unflags = -std=gnu++11
build_flags =
    -O2
    -std=gnu++17
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DCORE_DEBUG_LEVEL=1
    ; TFT_eSPI is configured here instead of editing its User_Setup files.
    -DUSER_SETUP_LOADED=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=80000000
    -DSPI_READ_FREQUENCY=20000000
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320

; FNK0114B: 2.8" 240x320 ST7789 TN, XPT2046 touch on its own bit-banged pins.
[env:fnk0114b]
upload_port = COM7
monitor_port = COM7
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF=1
    -DBOARD_CYD=1
    -DTOUCH_CS_PIN=33
    -DTOUCH_CLK_PIN=25
    -DTOUCH_DIN_PIN=32
    -DTOUCH_DOUT_PIN=39

; ---------------------------------------------------------------------------
; ESP32-S3-DevKitC-1 N16R8 + 1.9" 170x320 ST7789V (SPI, write-only, no touch).
; Board is flashed through the UART USB-C port (CH343, COM9).
; The pin/panel flags here are the single source of truth for every S3 sketch.
[s3_19in]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi   ; 16 MB QIO flash + 8 MB octal PSRAM
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
upload_port = COM9
monitor_port = COM9
display_flags =
    -DBOARD_HAS_PSRAM
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DCGRAM_OFFSET=1                         ; 170 wide -> TFT_eSPI applies colstart 35
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_INVERSION_ON=1
    -DTFT_MISO=-1
    ; J1 run 8,3,46,9,10,11 = BLK,CS,DC,RES,SDA,SCL: same order as the panel header, so the wires don't cross
    -DTFT_MOSI=10
    -DTFT_SCLK=11
    -DTFT_CS=3                               ; strapping pin (JTAG select), harmless unless that eFuse is burned
    -DTFT_DC=46                              ; strapping pin: must not be pulled high while BOOT/GPIO0 is low
    -DTFT_RST=9
    -DTFT_BL=8
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1                        ; FSPI default maps to the flash SPI regs on S3
    -DSPI_READ_FREQUENCY=20000000

; Stage 1 wiring test: pio run -e wiring-test -t upload && pio device monitor -e wiring-test
[env:wiring-test]
extends = s3_19in
build_src_filter = -<*> +<../test/wiring_test.cpp>
lib_deps = bodmer/TFT_eSPI@2.5.43
build_flags =
    -O2
    -std=gnu++17
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DCORE_DEBUG_LEVEL=1
    ${s3_19in.display_flags}
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    ; SPI clock as a variable so T5 can switch 40/80 MHz at runtime
    -DSPI_FREQUENCY=tft_spi_hz
    -include "$PROJECT_DIR/test/spi_freq.h"

; Throwaway: software-SPI panel test with no TFT_eSPI, to separate wiring from library config.
[env:bitbang-test]
extends = s3_19in
build_src_filter = -<*> +<../test/bitbang_test.cpp>
lib_deps =
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1
    ${s3_19in.display_flags}

; Throwaway: walk each display signal pin high/low for multimeter checks.
[env:pinwalk-test]
extends = s3_19in
build_src_filter = -<*> +<../test/pinwalk_test.cpp>
lib_deps =
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1
    ${s3_19in.display_flags}

; Clockling itself on the S3 + 1.9" board. No touch; BOOT button is the only input.
; Build + flash:  pio run -e s3-19in -t upload
[env:s3-19in]
extends = s3_19in
build_src_filter = +<*> -<touch.cpp>
build_flags =
    -O2
    -std=gnu++17
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DCORE_DEBUG_LEVEL=1
    ${s3_19in.display_flags}
    -UTFT_RGB_ORDER
    -DTFT_RGB_ORDER=TFT_BGR                  ; Clockling's sprite colours assume the CYD's BGR panel order
    -DNO_DMA=1
    -DBOARD_RGB_LED=48                       ; onboard WS2812 (v1.0 boards; some v1.1 use GPIO38)
    -DSPI_FREQUENCY=80000000
