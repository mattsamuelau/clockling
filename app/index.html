<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
    <meta name="description" content="Clockling - battle sim widget"/>
    <title>Clockling</title>
    <link rel="stylesheet" type="text/css" href="css/style.css"/>
</head>
<body>
    <canvas id="swarm"></canvas>
    <div id="face">
        <div id="clock">
            <div id="time">--:--</div>
            <div id="sec"></div>
            <div id="date">---</div>
        </div>
    </div>
    <div id="pause" style="display:none;">&#10073;&#10073;</div>
    <script src="js/settings.js"></script>
    <script src="js/tuning-meta.js"></script>
    <script src="js/swarm.js"></script>
    <script>
        /* Make TUNING available to the settings controller. */
        var TUNING = Swarm.TUNING;
    </script>
    <script src="js/settings-ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
