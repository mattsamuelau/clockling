<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Clockling - live tuning preview</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            padding: 12px;
            display: flex;
            gap: 20px;
            background: radial-gradient(1200px 700px at 50% 20%, #191233 0%, #0a0714 70%);
            color: #e8e2ff;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        /* Left panel: Settings */
        #settingsPanel {
            width: 260px;
            max-height: 100vh;
            overflow-y: auto;
            background: rgba(10, 7, 20, .85);
            border: 1px solid #4b3f7a;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 12px;
        }

        #settingsPanel h2 { margin: 0 0 8px; font-size: 14px; letter-spacing: 2px; color: #b6ff5e; text-transform: uppercase; }
        
        .settings-group {
            border-top: 1px solid #2d2350;
            padding-top: 8px;
            margin-top: 4px;
        }
        .settings-group:first-child { border-top: none; margin-top: 0; padding-top: 0; }
        .settings-group h3 { margin: 0 0 6px; font-size: 11px; letter-spacing: 1px; color: #8f84bd; text-transform: uppercase; }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }
        .settings-row label { flex: 1; display: flex; align-items: center; gap: 4px; color: #cfc4ff; }
        .settings-row input[type="number"] {
            width: 60px;
            background: #221a3d;
            color: #fff;
            border: 1px solid #4b3f7a;
            border-radius: 4px;
            padding: 3px 5px;
            font-size: 11px;
        }
        .settings-row input[type="checkbox"] {
            cursor: pointer;
        }
        .settings-row button {
            width: 28px;
            height: 24px;
            padding: 0;
            background: #2d2350;
            color: #8f84bd;
            border: 1px solid #4b3f7a;
            border-radius: 3px;
            font-size: 10px;
            cursor: pointer;
        }
        .settings-row button:hover {
            background: #3d3450;
            color: #b6ff5e;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #2d2350;
        }
        button.action {
            flex: 1;
            background: #221a3d;
            color: #cfc4ff;
            border: 1px solid #4b3f7a;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 11px;
            cursor: pointer;
        }
        button.action:hover { background: #2d2350; border-color: #b6ff5e; color: #b6ff5e; }

        .collapsible {
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .collapsible::before {
            content: "▶";
            width: 12px;
            text-align: center;
            color: #8f84bd;
        }
        .collapsible.expanded::before { content: "▼"; }
        .collapsible-content { display: none; }
        .collapsible.expanded + .collapsible-content { display: block; }

        /* Center: Sim display */
        #displayArea {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex: 1;
        }

        h1 { font-size: 15px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #8f84bd; margin: 0 0 12px; }

        #stage { min-width: 300px; min-height: 500px; }
        #screen { width: 864px; height: 864px; overflow: hidden; background: #0b0618; border: 1px solid #4b3f7a; }
        iframe { width: 864px; height: 864px; border: 0; display: block; }

        #controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button { background: #221a3d; color: #cfc4ff; border: 1px solid #4b3f7a; border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
        button:hover { background: #2d2350; border-color: #b6ff5e; color: #b6ff5e; }
        #controls label.ctl { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #cfc4ff; }
        #controls select { background: #221a3d; color: #cfc4ff; border: 1px solid #4b3f7a; border-radius: 8px; padding: 5px 8px; font-size: 13px; }

        .hint { font-size: 12px; color: #6d6392; margin-top: 10px; text-align: center; }

        #settingsPanel::-webkit-scrollbar { width: 8px; }
        #settingsPanel::-webkit-scrollbar-track { background: transparent; }
        #settingsPanel::-webkit-scrollbar-thumb { background: #4b3f7a; border-radius: 4px; }
        #settingsPanel::-webkit-scrollbar-thumb:hover { background: #6b5f9a; }
    </style>
</head>
<body>
    <div id="settingsPanel">
        <h2>Settings</h2>
        <div id="settingsContent"></div>
        <div class="action-buttons">
            <button class="action" id="saveBtn">Save All</button>
            <button class="action" id="resetBtn">Reset</button>
        </div>
    </div>

    <div id="displayArea">
        <h1>Clockling &middot; live tuning</h1>
        <div id="stage">
            <div id="screen"><iframe id="simFrame"></iframe></div>
        </div>
        <div id="controls">
            <button data-k="sec" data-t="toggle">Seconds on/off</button>
            <button data-k="hour24" data-t="toggle">12h / 24h</button>
            <label class="ctl">Size <select id="resSel"><option value="small">Small</option><option value="medium" selected>Medium</option><option value="large">Large</option></select></label>
            <label class="ctl">Time <select id="speedSel"><option value="1">1x</option><option value="2" selected>2x</option><option value="5">5x</option><option value="10">10x</option></select></label>
            <label class="ctl">Units <select id="scaleSel"><option value="1">1x</option><option value="2" selected>2x</option><option value="5">5x</option><option value="10">10x</option></select></label>
        </div>
        <p class="hint">Run <code>node server.js</code> from project root</p>
    </div>

    <script src="app/js/settings.js"></script>
    <script src="app/js/tuning-meta.js"></script>
    <script src="app/js/swarm.js"></script>
    <script>
        /* Make TUNING globally available from Swarm module */
        var TUNING = Swarm.TUNING;
    </script>
    <script src="app/js/settings-ui.js"></script>
    <script>
        var state = { sec: 1, hour24: 1, speed: 2, scale: 2 };
        var currentSettings, currentTuning;

        function loadCurrent() {
            currentSettings = SettingsUI.loadSettings();
            currentTuning = SettingsUI.loadTuning();
        }

        function buildUI() {
            loadCurrent();
            var container = document.getElementById("settingsContent");
            container.innerHTML = "";

            var visibleSettings = [], advancedSettings = [];
            var visibleTuning = [], advancedTuning = [];

            for (var key in TUNING_META.settings) {
                if (TUNING_META.settings[key].class === "Visible") visibleSettings.push(key);
                else advancedSettings.push(key);
            }
            for (var key in TUNING_META.tuning) {
                if (TUNING_META.tuning[key].class === "Visible") visibleTuning.push(key);
                else advancedTuning.push(key);
            }

            /* Visible Settings */
            if (visibleSettings.length) {
                var grp = document.createElement("div");
                grp.className = "settings-group";
                var h = document.createElement("h3");
                h.textContent = "Display";
                grp.appendChild(h);
                for (var i = 0; i < visibleSettings.length; i++) {
                    addRow(grp, visibleSettings[i], "setting", false);
                }
                container.appendChild(grp);
            }

            /* Visible Tuning */
            if (visibleTuning.length) {
                var grp = document.createElement("div");
                grp.className = "settings-group";
                var h = document.createElement("h3");
                h.textContent = "Battle";
                grp.appendChild(h);
                for (var i = 0; i < visibleTuning.length; i++) {
                    addRow(grp, visibleTuning[i], "tuning", false);
                }
                container.appendChild(grp);
            }

            /* Advanced collapsible */
            if (advancedSettings.length || advancedTuning.length) {
                var coll = document.createElement("div");
                coll.className = "collapsible settings-group";
                coll.textContent = "Advanced";
                coll.addEventListener("click", function () { this.classList.toggle("expanded"); });
                container.appendChild(coll);

                var cont = document.createElement("div");
                cont.className = "collapsible-content";

                if (advancedSettings.length) {
                    var grp = document.createElement("div");
                    grp.className = "settings-group";
                    var h = document.createElement("h3");
                    h.textContent = "Settings";
                    grp.appendChild(h);
                    for (var i = 0; i < advancedSettings.length; i++) {
                        addRow(grp, advancedSettings[i], "setting", false);
                    }
                    cont.appendChild(grp);
                }

                if (advancedTuning.length) {
                    var grp = document.createElement("div");
                    grp.className = "settings-group";
                    var h = document.createElement("h3");
                    h.textContent = "Tuning";
                    grp.appendChild(h);
                    for (var i = 0; i < advancedTuning.length; i++) {
                        addRow(grp, advancedTuning[i], "tuning", false);
                    }
                    cont.appendChild(grp);
                }

                container.appendChild(cont);
            }
        }

        function addRow(parent, key, type, show) {
            var meta = type === "setting" ? TUNING_META.settings[key] : TUNING_META.tuning[key];
            var val = type === "setting" ? currentSettings[key] : currentTuning[key];

            if (key === "mapW" || key === "mapH") return;

            var row = document.createElement("div");
            row.className = "settings-row";

            if (typeof meta.default === "boolean") {
                var label = document.createElement("label");
                label.title = meta.meaning;
                var cb = document.createElement("input");
                cb.type = "checkbox";
                cb.checked = val;
                cb.title = meta.meaning;
                cb.setAttribute("data-key", key);
                cb.setAttribute("data-type", type);
                label.appendChild(cb);
                label.appendChild(document.createTextNode(" " + niceName(key)));
                row.appendChild(label);
            } else {
                var label = document.createElement("label");
                label.textContent = niceName(key);
                label.title = meta.meaning;
                row.appendChild(label);
                var inp = document.createElement("input");
                inp.type = "number";
                inp.value = val;
                inp.step = "0.1";
                inp.title = meta.meaning;
                inp.setAttribute("data-key", key);
                inp.setAttribute("data-type", type);
                row.appendChild(inp);
            }

            var btn = document.createElement("button");
            btn.textContent = "↺";
            btn.title = "Revert to default";
            btn.setAttribute("data-key", key);
            btn.setAttribute("data-type", type);
            btn.addEventListener("click", function (e) {
                e.preventDefault();
                var k = this.getAttribute("data-key");
                var t = this.getAttribute("data-type");
                if (t === "setting") currentSettings[k] = TUNING_META.settings[k].default;
                else currentTuning[k] = TUNING_META.tuning[k].default;
                buildUI();
                apply();
            });
            row.appendChild(btn);
            parent.appendChild(row);
        }

        function niceName(key) {
            var names = {
                maxLings: "Maximum zerglings", maxBanes: "Maximum banelings", maxMarines: "Maximum marines",
                lingHp: "Zergling health", baneHp: "Baneling health", marineHp: "Marine health",
                attackGroupSize: "Zerglings to attack", berserkBanes: "Banelings to berserk",
                berserkUntilDeath: "Berserk until death",
                maxEngageMarines: "Max marines to engage", allyRadius: "Ally scan radius",
                marineScanRadius: "Marine scan radius", marineGroupRadius: "Marine group radius",
                berserkCatchRadius: "Berserk catch radius", berserkSpeedMult: "Berserk speed boost",
                zergSpeed: "Zerg base speed", terranSpeed: "Terran base speed",
                marineTactics: "Marine tactics",
                showSeconds: "Show seconds", showClock: "Show clock",
                hour24: "24-hour clock", respawnInterval: "Egg refill interval", respawnBatch: "Eggs per refill",
                eggTimeMin: "Egg hatch min (s)", eggTimeMax: "Egg hatch max (s)"
            };
            if (names[key]) return names[key];
            return key.replace(/([A-Z])/g, " $1").replace(/^./, function (c) { return c.toUpperCase(); });
        }

        function apply() {
            var q = "app/index.html?sec=" + state.sec + "&hour24=" + state.hour24 + "&speed=" + state.speed + "&scale=" + state.scale;
            for (var key in currentTuning) {
                q += "&tun_" + encodeURIComponent(key) + "=" + encodeURIComponent(currentTuning[key]);
            }
            document.getElementById("simFrame").src = q;
        }

        document.getElementById("saveBtn").addEventListener("click", function () {
            var inputs = document.querySelectorAll("#settingsPanel input");
            for (var i = 0; i < inputs.length; i++) {
                var inp = inputs[i];
                var key = inp.getAttribute("data-key");
                var type = inp.getAttribute("data-type");
                if (key && type) {
                    var val = inp.type === "checkbox" ? inp.checked : parseFloat(inp.value);
                    if (type === "setting") currentSettings[key] = val;
                    else currentTuning[key] = val;
                }
            }
            SettingsUI.saveSettings(currentSettings);
            SettingsUI.saveTuning(currentTuning);
            this.textContent = "✓ Saved";
            var self = this;
            setTimeout(function () { self.textContent = "Save All"; }, 1500);
            apply();
        });

        document.getElementById("resetBtn").addEventListener("click", function () {
            if (confirm("Reset all to defaults?")) {
                SettingsUI.resetAllSettings();
                SettingsUI.resetAllTuning();
                buildUI();
                applySize(); /* re-apply the size preset so mapW/mapH stay correct */
                apply();
            }
        });

        var resSel = document.getElementById("resSel");
        var sizes = {
            small: { w: 432, h: 432 },
            medium: { w: 864, h: 864 },
            large: { w: 1296, h: 1296 }
        };

        function applySize() {
            var size = sizes[resSel.value];
            var w = size.w, h = size.h;
            currentTuning.mapW = w;
            currentTuning.mapH = h;
            document.getElementById("simFrame").style.width = w + "px";
            document.getElementById("simFrame").style.height = h + "px";
            document.getElementById("screen").style.width = w + "px";
            document.getElementById("screen").style.height = h + "px";
        }

        resSel.addEventListener("change", function () { applySize(); apply(); });

        var speedSel = document.getElementById("speedSel");
        var scaleSel = document.getElementById("scaleSel");
        function liveSim() {
            var f = document.getElementById("simFrame");
            if (f && f.contentWindow && f.contentWindow.Swarm) {
                f.contentWindow.Swarm.setGameSpeed(speedSel.value);
                f.contentWindow.Swarm.setUnitScale(scaleSel.value);
            }
        }
        speedSel.addEventListener("change", function () {
            state.speed = this.value;
            liveSim();
        });
        scaleSel.addEventListener("change", function () {
            state.scale = this.value;
            liveSim();
        });

        var btns = document.querySelectorAll("button[data-k]");
        for (var i = 0; i < btns.length; i++) {
            btns[i].addEventListener("click", function () {
                var k = this.getAttribute("data-k");
                if (this.getAttribute("data-t") === "toggle") {
                    state[k] = state[k] ? 0 : 1;
                } else if (this.getAttribute("data-d")) {
                    state[k] = Math.max(1, state[k] + parseInt(this.getAttribute("data-d"), 10));
                }
                apply();
            });
        }

        buildUI();
        applySize();
        apply();
    </script>
</body>
</html>
